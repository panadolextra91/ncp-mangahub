syntax = "proto3";

package mangahub.v1;

option go_package = "github.com/user/mangahub/pkg/pb";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// --- Models ---

message Manga {
    int32 id = 1;
    string title = 2;
    string author = 3;
    string description = 4;
}

message UserProgress {
    int32 manga_id = 1;
    int32 last_chapter = 2;
    google.protobuf.Timestamp updated_at = 3;
}

message EventNotification {
    string topic = 1;
    string message = 2;
    google.protobuf.Timestamp timestamp = 3;
}

// --- Requests & Responses ---

message GetMangaRequest {
    int32 id = 1;
}

message UpdateProgressRequest {
    int32 manga_id = 1;
    int32 chapter = 2;
}

message UpdateProgressResponse {
    bool success = 1;
    string message = 2;
}

message CreateMangaRequest {
    string title = 1;
    string author = 2;
    string description = 3;
}

message DeleteMangaRequest {
    int32 id = 1;
}

message DeleteMangaResponse {
    bool success = 1;
}

// --- Services ---

service MangaService {
    // User functions
    rpc GetManga(GetMangaRequest) returns (Manga);
    rpc UpdateProgress(UpdateProgressRequest) returns (UpdateProgressResponse);
    
    // Real-time Event Streaming (Server-side)
    rpc SubscribeEvents(google.protobuf.Empty) returns (stream EventNotification);
}

service AdminService {
    // Admin functions
    rpc CreateManga(CreateMangaRequest) returns (Manga);
    rpc DeleteManga(DeleteMangaRequest) returns (DeleteMangaResponse);
}
