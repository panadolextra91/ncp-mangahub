name: MangaHub CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y sqlite3 libsqlite3-dev
        go mod download

    - name: Run Tests
      run: go test -v ./internal/...

    - name: Build Server
      run: go build -v -o server cmd/server/main.go

    - name: Build TUI Client
      run: go build -v -o tui cmd/client/main.go

    - name: Docker Build Check
      run: docker build -t mangahub-server:latest .
