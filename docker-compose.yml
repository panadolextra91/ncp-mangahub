version: '3.8'

services:
  mangahub-server:
    build: .
    container_name: mangahub-server
    ports:
      - "8080:8080"   # HTTP
      - "9090:9090"   # TCP
      - "9191:9191/udp" # UDP
      - "50052:50052" # gRPC
    volumes:
      - ./data:/app/data
    environment:
      - JWT_SECRET=pink-hub-secret-2024
      - DB_PATH=/app/data/mangahub.db
    restart: unless-stopped

networks:
  default:
    name: mangahub-network
